# Dependabot policy for the finalized AssembleMonitor.
#
# Routine version-update PRs are disabled to avoid unnecessary
# dependency churn on the verified project baseline.
#
# Dependabot security updates remain enabled through GitHub's
# repository security settings and may still create pull requests
# when a vulnerable dependency requires remediation.

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
