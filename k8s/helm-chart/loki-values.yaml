deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: s3
    bucketNames:
      chunks: assemblemonitor-advance-dev-observability-s3
      ruler: assemblemonitor-advance-dev-observability-s3
      admin: assemblemonitor-advance-dev-observability-s3
    s3:
      region: us-east-1
      s3ForcePathStyle: false
      insecure: false
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

serviceAccount:
  create: true
  name: loki
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<AWS_ACCOUNT_ID>:role/assemblemonitor-advance-dev-obs-backend-irsa"

singleBinary:
  replicas: 1
  persistence:
    enabled: true

chunksCache:
  persistence:
    enabled: true

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
