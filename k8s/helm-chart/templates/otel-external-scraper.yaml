apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-external-scraper-config
  namespace: {{ .Values.namespace }}
data:
  config.yaml: |
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: 'manual-ec2-nodes'
              scrape_interval: 15s
              static_configs:
                - targets: ["<JENKINS_PRIVATE_IP>:9100"]
                  labels:
                    instance: "jenkins-server"
                - targets: ["<K3S_PRIVATE_IP>:9100"]
                  labels:
                    instance: "k3s-server"
                - targets: ["<SONARQUBE_PRIVATE_IP>:9100"]
                  labels:
                    instance: "sonar-server"
    
    processors:
      batch:
        send_batch_size: 1024
        timeout: 1s
        
    exporters:
      prometheusremotewrite:
        endpoint: "{{ .Values.otel.ampWorkspaceUrl }}/api/v1/remote_write"
        auth:
          authenticator: sigv4auth
          
    extensions:
      sigv4auth:
        region: "{{ .Values.otel.region }}"
        service: aps
        
    service:
      extensions: [sigv4auth]
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [batch]
          exporters: [prometheusremotewrite]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-external-scraper
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-external-scraper
  template:
    metadata:
      labels:
        app: otel-external-scraper
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: otel-collector
          image: "otel/opentelemetry-collector-contrib:0.157.0"
          command: ["/otelcol-contrib", "--config=/etc/otelcol/config.yaml"]
          volumeMounts:
            - name: config-volume
              mountPath: /etc/otelcol
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: config-volume
          configMap:
            name: otel-external-scraper-config
