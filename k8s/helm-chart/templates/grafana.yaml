apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: {{ .Values.namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.grafana.irsaRoleArn }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Values.namespace }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Amazon Managed Prometheus
        type: prometheus
        access: proxy
        url: {{ .Values.otel.ampWorkspaceUrl }}
        jsonData:
          sigV4Auth: true
          sigV4AuthType: default
          sigV4Region: {{ .Values.otel.region }}
      - name: Loki
        type: loki
        access: proxy
        url: http://{{ .Release.Name }}-loki.{{ .Values.namespace }}.svc.cluster.local:3100
      - name: Tempo
        type: tempo
        access: proxy
        url: http://{{ .Release.Name }}-tempo.{{ .Values.namespace }}.svc.cluster.local:3100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      serviceAccountName: grafana
      containers:
        - name: grafana
          image: grafana/grafana:11.5.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: "awsAuthV4"
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Values.namespace }}
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: grafana
