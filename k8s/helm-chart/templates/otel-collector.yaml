apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: {{ .Values.namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.otel.irsaRoleArn }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "nodes/metrics", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "apps"]
    resources: ["replicasets", "deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: {{ .Values.namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-conf
  namespace: {{ .Values.namespace }}
data:
  otel-collector-config: |
    extensions:
      sigv4auth:
        region: {{ .Values.otel.region }}
        service: aps
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/kube-system_*/*/*.log
        start_at: beginning
        operators:
          - type: container
            id: container-parser
          - type: regex_parser
            regex: '^/var/log/pods/(?P<namespace>[a-zA-Z0-9\-]+)_(?P<pod_name>[a-zA-Z0-9\-]+)_(?P<pod_uid>[a-f0-9\-]+)/(?P<container_name>[a-zA-Z0-9\-]+)/(?P<restart_count>\d+)\.log$'
            parse_from: attributes["log.file.path"]
      prometheus:
        config:
          scrape_configs:
            - job_name: 'kubernetes-pods'
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: "true"
            - job_name: 'kube-state-metrics'
              kubernetes_sd_configs:
                - role: endpoints
              relabel_configs:
                - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
                  action: keep
                  regex: "kube-state-metrics"
            - job_name: 'manual-ec2-nodes'
              static_configs:
                - targets: ["<JENKINS_PRIVATE_IP>:9100"]
                  labels:
                    instance: "jenkins-server"
                - targets: ["<K3S_PRIVATE_IP>:9100"]
                  labels:
                    instance: "k3s-server"
                - targets: ["<SONARQUBE_PRIVATE_IP>:9100"]
                  labels:
                    instance: "sonarqube-server"
    processors:
      transform:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(attributes["service.name"], attributes["container_name"])
              - set(attributes["pod"], attributes["pod_name"])
      groupbyattrs:
        keys:
          - service.name
          - namespace
          - pod
    exporters:
      otlphttp/loki:
        endpoint: "http://{{ .Release.Name }}-loki.{{ .Values.namespace }}.svc.cluster.local:3100"
      otlp/tempo:
        endpoint: "{{ .Release.Name }}-tempo.{{ .Values.namespace }}.svc.cluster.local:4317"
        tls:
          insecure: true
      prometheusremotewrite:
        endpoint: "{{ .Values.otel.ampWorkspaceUrl }}api/v1/remote_write"
        auth:
          authenticator: sigv4auth
    service:
      extensions: [sigv4auth]
      pipelines:
        logs:
          receivers: [filelog]
          processors: [transform, groupbyattrs]
          exporters: [otlphttp/loki]
        traces:
          receivers: [otlp]
          exporters: [otlp/tempo]
        metrics:
          receivers: [prometheus]
          exporters: [prometheusremotewrite]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        checksum/config: "v4"
    spec:
      serviceAccountName: otel-collector
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.157.0
          command:
            - "/otelcol-contrib"
            - "--config=/conf/otel-collector-config.yaml"
          volumeMounts:
            - name: otel-collector-config-vol
              mountPath: /conf
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: otel-collector-config-vol
          configMap:
            name: otel-collector-conf
            items:
              - key: otel-collector-config
                path: otel-collector-config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
  selector:
    app: otel-collector
