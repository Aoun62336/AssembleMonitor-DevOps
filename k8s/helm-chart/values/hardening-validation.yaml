# =============================================================================
# AssembleMonitor — Hardening Validation Values (k3d local testing only)
#
# Enables hardening features that remain disabled by default in app.yaml
# for historical EKS compatibility.
#
# Local k3d/K3s validation uses:
#   1. k8s/validation/hardening-smoke.yaml for disposable test workloads.
#   2. Helm-rendered templates/pdb.yaml for voluntary-disruption testing.
#   3. Helm-rendered templates/networkpolicy.yaml for traffic-isolation testing.
#
# See docs/ops/VERIFICATION_PLAYBOOK.md for the complete procedure.
# Do not use this file to imply that the later hardening revision was
# deployed to the historical AWS EKS environment.
# =============================================================================

# Enable NetworkPolicy for local k3d/K3s runtime validation.
# K3s includes a kube-router-based NetworkPolicy controller unless that
# controller is explicitly disabled.
networkPolicy:
  enabled: true

# Override namespace so Helm-rendered NetworkPolicy and PDB target the k3d
# test namespace, not the production namespace (assemblemonitor).
namespace: assemblemonitor-hardening-test

# Enable PDB for the k3d drain test (requires HPA enabled so the condition
# in templates/pdb.yaml evaluates to true).
backend:
  hpa:
    enabled: true
  pdb:
    enabled: true
    maxUnavailable: 1

frontend:
  hpa:
    enabled: true
  pdb:
    enabled: true
    maxUnavailable: 1

# Minimum Loki subchart config to satisfy the Loki Helm template engine.
# Without bucketNames.chunks, helm template fails on loki/templates/_helpers.tpl:231
# even when using --show-only on a non-Loki template (e.g. networkpolicy.yaml).
# These are placeholder names — Loki is NOT deployed to k3d in this test.
loki:
  loki:
    storage:
      bucketNames:
        chunks: "hardening-test"
        ruler: "hardening-test"
        admin: "hardening-test"
