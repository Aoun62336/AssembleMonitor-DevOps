# -----------------------------------------------------------------------------
# VALUES/OBSERVABILITY.YAML
# EKS Production Environment Values - Observability Infrastructure Layer
# -----------------------------------------------------------------------------

grafana:
  irsaRoleArn: "arn:aws:iam::<AWS_ACCOUNT_ID>:role/assemblemonitor-advance-dev-grafana-irsa-role" # Will be replaced with actual Terraform output

otel:
  irsaRoleArn: "arn:aws:iam::<AWS_ACCOUNT_ID>:role/assemblemonitor-advance-dev-otel-irsa-role" # Will be replaced with actual Terraform output
  ampWorkspaceUrl: "https://aps-workspaces.us-east-1.amazonaws.com/workspaces/ws-2e6356f2-a104-4823-8acd-9846dd16f30d/" # Will be replaced with actual Terraform output
  region: "us-east-1"

loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    limits_config:
      allow_structured_metadata: true
    commonConfig:
      replication_factor: 1
    storage:
      type: s3
      bucketNames:
        chunks: assemblemonitor-advance-dev-observability-s3
        ruler: assemblemonitor-advance-dev-observability-s3
        admin: assemblemonitor-advance-dev-observability-s3
      s3:
        region: us-east-1
        s3ForcePathStyle: false
        insecure: false
    schemaConfig:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
  serviceAccount:
    create: true
    name: loki
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::<AWS_ACCOUNT_ID>:role/assemblemonitor-advance-dev-obs-backend-irsa" # Will be replaced with actual Terraform output
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

tempo:
  tempo:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    storage:
      trace:
        backend: s3
        s3:
          bucket: assemblemonitor-advance-dev-observability-s3
          endpoint: s3.us-east-1.amazonaws.com
          region: us-east-1
  serviceAccount:
    create: true
    name: tempo
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::<AWS_ACCOUNT_ID>:role/assemblemonitor-advance-dev-obs-backend-irsa" # Will be replaced with actual Terraform output

opentelemetry-collector:
  mode: daemonset
  fullnameOverride: "otel-collector"
  nameOverride: "otel-collector"
  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      protocol: TCP
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.157.0"
  command:
    name: otelcol-contrib
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 500Mi
  tolerations:
    - operator: Exists
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::<AWS_ACCOUNT_ID>:role/assemblemonitor-advance-dev-otel-irsa-role" # Will be replaced with actual Terraform output
  clusterRole:
    create: true
    rules:
      - apiGroups: [""]
        resources:
          [
            "pods",
            "namespaces",
            "nodes",
            "nodes/metrics",
            "services",
            "endpoints",
          ]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["apps"]
        resources: ["replicasets", "deployments", "daemonsets", "statefulsets"]
        verbs: ["get", "list", "watch"]
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  extraEnvs:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  extraVolumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
    - name: varlibdockercontainers
      mountPath: /var/lib/docker/containers
      readOnly: true
  extraVolumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
    - name: varlibdockercontainers
      hostPath:
        path: /var/lib/docker/containers
  config:
    extensions:
      sigv4auth:
        region: "us-east-1"
        service: aps
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/kube-system_*/*/*.log
        start_at: beginning
        include_file_path: true
        operators:
          - type: container
            id: container-parser
          - type: regex_parser
            regex: '^/var/log/pods/(?P<namespace>[a-zA-Z0-9\-]+)_(?P<pod_name>[a-zA-Z0-9\-]+)_(?P<pod_uid>[a-f0-9\-]+)/(?P<container_name>[a-zA-Z0-9\-]+)/(?P<restart_count>\d+)\.log$'
            parse_from: attributes["log.file.path"]
      prometheus:
        config:
          scrape_configs:
            - job_name: "kubernetes-cadvisor"
              scheme: https
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                insecure_skip_verify: true
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - source_labels: [__meta_kubernetes_node_name]
                  action: keep
                  regex: ${K8S_NODE_NAME}
                - target_label: __metrics_path__
                  replacement: /metrics/cadvisor
            - job_name: "kube-state-metrics"
              kubernetes_sd_configs:
                - role: endpoints
              relabel_configs:
                - source_labels:
                    [__meta_kubernetes_service_label_app_kubernetes_io_name]
                  action: keep
                  regex: "kube-state-metrics"
                - source_labels: [__meta_kubernetes_endpoint_node_name]
                  action: keep
                  regex: ${K8S_NODE_NAME}

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      batch:
        send_batch_size: 1024
        timeout: 1s
      groupbyattrs:
        keys:
          - container_name
          - namespace
          - pod_name
          - pod_uid
      resource:
        attributes:
          - key: service.name
            from_attribute: container_name
            action: upsert
          - key: k8s.namespace.name
            from_attribute: namespace
            action: insert
          - key: k8s.pod.name
            from_attribute: pod_name
            action: insert
          - key: k8s.pod.uid
            from_attribute: pod_uid
            action: insert
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
            - k8s.node.name
            - k8s.deployment.name
        passthrough: false
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
    exporters:
      otlphttp/loki:
        endpoint: "http://assemblemonitor-eks-loki.assemblemonitor.svc.cluster.local:3100/otlp"
      otlp/tempo:
        endpoint: "assemblemonitor-eks-tempo.assemblemonitor.svc.cluster.local:4317"
        tls:
          insecure: true
      prometheusremotewrite:
        endpoint: "https://aps-workspaces.us-east-1.amazonaws.com/workspaces/ws-2e6356f2-a104-4823-8acd-9846dd16f30d/api/v1/remote_write" # Will be replaced with actual Terraform output
        auth:
          authenticator: sigv4auth
    service:
      telemetry:
        metrics:
          address: null
          level: none
      extensions: [sigv4auth, health_check]
      pipelines:
        logs:
          receivers: [filelog]
          processors:
            [memory_limiter, groupbyattrs, resource, k8sattributes, batch]
          exporters: [otlphttp/loki]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [prometheusremotewrite]
