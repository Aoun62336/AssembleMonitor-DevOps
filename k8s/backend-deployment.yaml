apiVersion: apps/v1
kind: Deployment
metadata:
  name: assemblemonitor-backend
  namespace: assemblemonitor
  labels:
    app: assemblemonitor-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assemblemonitor-backend
  template:
    metadata:
      labels:
        app: assemblemonitor-backend
    spec:
      containers:
        - name: backend
          image: fire2686/assemblemonitor-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: assemblemonitor-secret
                  key: DATABASE_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: assemblemonitor-secret
                  key: JWT_SECRET_KEY
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: assemblemonitor-secret
                  key: AWS_REGION
            - name: S3_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: assemblemonitor-secret
                  key: S3_BUCKET_NAME
            - name: PYTHONPATH
              value: /app
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
